name: ci
on:
  push:
  pull_request:
jobs:
  solutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: solutions must stay green
        env:
          AGENTSTACK_PEEK: "1"
        run: pytest
  stubs-are-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: student stubs must not silently pass
        run: python scripts/expect_red.py
